<!doctype html><html lang="ja"><meta charset="utf-8"><title>SoundSky · Paper recovery</title>
<style>body{margin:24px;font:15px/1.6 system-ui;background:#18222b;color:white}main{position:relative;z-index:1}button{font:inherit;padding:8px 16px}.effects{display:flex;gap:12px;flex-wrap:wrap}.effect{width:128px;height:100px;position:relative;border:1px solid #7b8894}.heatmap-surface{position:absolute;inset:0}.playControls{position:fixed;bottom:0;left:0;right:0;background:#18222b;z-index:2}.playControls__elements{display:flex;align-items:center;gap:16px;height:60px}.playControl{position:relative;width:48px;height:48px}.playbackTimeline__progressWrapper{width:240px;height:14px;background:#456}.playbackTimeline__progressBar{position:relative;width:40%;height:100%}.volume__sliderWrapper{width:60px;height:10px}pre{white-space:pre-wrap}body>[data-soundsky-site-shader]{width:100%;height:100%}</style>
<body class="theme-dark"><main><h1>各エフェクトの描画復帰</h1><p>実際のカバー・背景・再生ボタン・シークバーを使い、GPU停止中の設定変更と復帰後の静止状態、資源解放を確認します。音声は再生しません。</p><button id="run">エフェクトの復帰を検証</button><div class="effects"><div id="metal" class="effect"></div><div id="heat" class="effect"></div><div id="background" class="effect"></div><div id="console" class="effect"></div><div id="seek" class="effect"></div></div><pre id="result" role="status">待機中</pre></main>
<div class="playControls"><div class="playControls__elements"><button class="playControl playing" title="Pause current">Play</button><button class="skipControl__previous">Previous</button><button class="skipControl__next">Next</button><div class="playbackTimeline is-scrubbable"><div class="playbackTimeline__progressWrapper" aria-valuenow="34" aria-valuemax="248"><div class="playbackTimeline__progressBar"></div></div></div><div class="volume"><button class="volume__button">Mute</button><div class="volume__sliderWrapper" aria-valuenow="0.4"></div></div><div class="playbackSoundBadge"><a class="playbackSoundBadge__titleLink" href="/artist/track" title="Fixture track">Fixture track</a><a class="playbackSoundBadge__lightLink" href="/artist">Fixture artist</a></div></div></div>
<script src="/paper-lifecycle.js"></script></body></html>
