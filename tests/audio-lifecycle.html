<h1>Web Audio lifecycle verification</h1><p>合成音をOfflineAudioContextで処理します。スピーカーへは出力しません。200回のコンテキスト生成・終了と、SoundSkyを破棄した後の波形を確認します。</p><button id="run">200回の検証を開始</button><pre id="result" data-status="idle" role="status">待機中</pre>
<h2>再生失敗と曲切り替え</h2><p>再生拒否の直後の速度・音程補正・音量と、前の音声要素の読み直しが現在の停止処理を取り消さないことを確認します。音声はミュートして処理します。</p><button id="play-failure">再生失敗・曲切替の検証を開始</button><pre id="play-result" role="status">待機中</pre>
<script src="/audio-lifecycle-monitor.js"></script><script src="/audio-preview.js"></script><script src="/audio-lifecycle.js"></script></html>
